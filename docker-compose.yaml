    version: '3'
    services:
      app:
        build: .
        container_name: wheelofmisery-app
        environment:
          - DATABASE_URL=${DATABASE_URL}
          - JWT_SECRET=${JWT_SECRET}
          - NODE_ENV=development
          - PORT=5000
        ports:
          - "5000:5000"
        volumes:
          - .:/app

      